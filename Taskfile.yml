version: '3'

dotenv: ['.env']

includes:
  server:
    taskfile: ./apps/server/Taskfile.yml
    dir: ./apps/server
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  dev:
    desc: Run the server without signing in and the web dev server, which proxies /api and /auth to it.
    deps: [server:dev, web:dev]

  hashes:
    desc: Regenerate the dependency hashes in nix/server.nix and nix/web.nix.
    cmds:
      - ./nix/update-hashes.sh

  build-image:
    desc: Build the TARGET (server or web) container image into .task/TARGET.tar for SYSTEM (default x86_64-linux).
    vars:
      TARGET: '{{.TARGET | default "server"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default (eq .TARGET "web" | ternary "git.kwkaiser.io/kwkaiser/housing-web" "git.kwkaiser.io/kwkaiser/housing")}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
      SYSTEM: '{{.SYSTEM | default "x86_64-linux"}}'
    cmds:
      - mkdir -p .task
      - |
        set -eu
        export IMAGE_NAME="{{.IMAGE_NAME}}"
        export IMAGE_TAG="{{.IMAGE_TAG}}"
        stream=$(nix build --impure --no-link --print-out-paths .#packages.{{.SYSTEM}}.{{.TARGET}}-image)
        "$stream" > .task/{{.TARGET}}.tar

  push-image:
    desc: Push .task/TARGET.tar to the container registry. Needs REGISTRY_USER and REGISTRY_TOKEN.
    vars:
      TARGET: '{{.TARGET | default "server"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default (eq .TARGET "web" | ternary "git.kwkaiser.io/kwkaiser/housing-web" "git.kwkaiser.io/kwkaiser/housing")}}'
      IMAGE_TAGS: '{{.IMAGE_TAGS | default .VERSION}}'
      TLS_VERIFY: '{{.TLS_VERIFY | default "true"}}'
    preconditions:
      - sh: test -f .task/{{.TARGET}}.tar
        msg: '.task/{{.TARGET}}.tar not found - run `task build-image TARGET={{.TARGET}}` first'
    cmds:
      - |
        set -eu
        : "${REGISTRY_USER:?REGISTRY_USER is not set}"
        : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is not set}"
        for tag in {{.IMAGE_TAGS}}; do
          echo "pushing {{.IMAGE_NAME}}:$tag"
          skopeo --insecure-policy copy \
            --dest-tls-verify={{.TLS_VERIFY}} \
            --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
            docker-archive:.task/{{.TARGET}}.tar \
            "docker://{{.IMAGE_NAME}}:$tag"
        done
