name: vendor-hash

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VENDOR_HASH_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update vendorHash
        run: |
          set -euo pipefail
          if out=$(nix build --no-link .#default 2>&1); then
            echo "vendorHash is up to date"
            exit 0
          fi
          got=$(printf '%s\n' "$out" | sed -n 's/.*got: *\(sha256-[A-Za-z0-9+/=]*\).*/\1/p' | head -n1)
          if [ -z "$got" ]; then
            printf '%s\n' "$out" >&2
            exit 1
          fi
          sed -i "s|vendorHash = \".*\";|vendorHash = \"$got\";|" nix/package.nix
          nix build --no-link .#default
          git config user.name "vendor-hash"
          git config user.email "vendor-hash@git.kwkaiser.io"
          git commit -am "update vendorHash"
          git push origin "HEAD:${{ github.ref_name }}"
