name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2.3'
        required: true

env:
  REGISTRY: git.kwkaiser.io
  IMAGE: git.kwkaiser.io/kwkaiser/housing
  WEB_IMAGE: git.kwkaiser.io/kwkaiser/housing-web

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Resolve version
        id: meta
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ -z "$version" ]; then
            echo "could not resolve a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

  images:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.gitea/actions/nix
        with:
          builder-key: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}

      - name: Build images
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          nix develop --command \
            task build-image TARGET=server IMAGE_NAME="$IMAGE" IMAGE_TAG="$VERSION" SYSTEM=x86_64-linux
          nix develop --command \
            task build-image TARGET=web IMAGE_NAME="$WEB_IMAGE" IMAGE_TAG="$VERSION" SYSTEM=x86_64-linux

      - name: Push images
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.K8S_GITEA_REGISTRY_PACKAGE_TOKEN }}
        run: |
          nix develop --command \
            task push-image TARGET=server IMAGE_NAME="$IMAGE" IMAGE_TAGS="$VERSION $SHA latest"
          nix develop --command \
            task push-image TARGET=web IMAGE_NAME="$WEB_IMAGE" IMAGE_TAGS="$VERSION $SHA latest"

  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.gitea/actions/nix
        with:
          builder-key: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-android-${{ hashFiles('apps/android/pnpm-lock.yaml') }}
          restore-keys: pnpm-android-

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/package.json', 'apps/android/pnpm-lock.yaml') }}
          restore-keys: gradle-

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE=/tmp/housing-release.p12
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          nix develop .#android --command task android:release APK_VERSION="$APK_VERSION"

      - name: Attach APK to the release
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TARGET: ${{ github.sha }}
          APK_VERSION: ${{ needs.meta.outputs.version }}
        run: nix develop .#android --command task android:publish APK_VERSION="$APK_VERSION"
