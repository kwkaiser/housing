name: vendor-hash

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VENDOR_HASH_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update vendorHash
        run: |
          set -euo pipefail
          nix develop --command task vendor-hash
          git diff --quiet nix/package.nix && exit 0
          git config user.name "vendor-hash"
          git config user.email "vendor-hash@git.kwkaiser.io"
          git commit -am "update vendorHash"
          git push origin "HEAD:${{ github.ref_name }}"
