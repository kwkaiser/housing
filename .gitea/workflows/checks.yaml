name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod

      - name: Vet
        working-directory: apps/server
        run: go vet ./...

      - name: Test
        working-directory: apps/server
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: API types match the server
        run: |
          nix develop --command task web:gen
          git diff --exit-code apps/web/src/lib/api

      - name: Check
        run: nix develop --command task web:check

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: nix build --no-link .#server .#web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build debug APK
        run: nix develop .#android --command task android:build
