server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name housing.example.com;

    ssl_certificate /etc/letsencrypt/live/housing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housing.example.com/privkey.pem;

    auth_basic "housing";
    auth_basic_user_file /etc/nginx/housing.htpasswd;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name housing.example.com;
    return 301 https://$host$request_uri;
}
